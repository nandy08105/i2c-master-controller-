
project:
  title:    "I2C Master Controller"
  author:   "Your Name"
  description: "Single-byte I2C master controller. ui_in[7]=cmd_valid, ui_in[6]=RW, ui_in[5:0]=addr. uio[0]=SCL, uio[1]=SDA."
  language: "Verilog"
  clock_hz: 10000000   # 10 MHz
  inputs:
    - "cmd_valid / write_data[7]"
    - "rw / write_data[6]"
    - "addr[5] / write_data[5]"
    - "addr[4] / write_data[4]"
    - "addr[3] / write_data[3]"
    - "addr[2] / write_data[2]"
    - "addr[1] / write_data[1]"
    - "addr[0] / write_data[0]"
  outputs:
    - "read_data[0]"
    - "read_data[1]"
    - "read_data[2]"
    - "read_data[3]"
    - "read_data[4]"
    - "read_data[5]"
    - "read_data[6]"
    - "read_data[7]"
  bidirectional:
    - "SCL (out)"
    - "SDA (bidirectional)"
    - "none"
    - "none"
    - "none"
    - "none"
    - "none"
    - "none"
